<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panthers Football Trivia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #101820;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-card {
      background-color: #1e293b;
      border: 3px solid #0085CA;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 25px rgba(0, 133, 202, 0.4);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    h1 {
      color: #0085CA;
      margin-top: 0;
      letter-spacing: 1px;
    }
    .score-board {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      background-color: #000000;
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid #0085CA;
    }
    .timer-container {
      width: 100%;
      background-color: #000000;
      height: 10px;
      border-radius: 5px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: #0085CA;
      transition: width 1s linear;
    }
    .question-text {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      font-weight: bold;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-option {
      background-color: #0085CA;
      color: white;
      border: none;
      padding: 0.85rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-option:hover {
      background-color: #006093;
      transform: translateY(-2px);
    }
    .result-msg {
      margin-top: 1.2rem;
      font-weight: bold;
      font-size: 1.1rem;
      min-height: 1.5rem;
    }
    .restart-btn {
      background-color: #0085CA;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 0.75rem 1.75rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.5rem;
      display: none;
    }
    .restart-btn:hover {
      background-color: #006093;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Panthers Trivia Challenge</h1>
    <div class="score-board">
      Score: <span id="score">0</span> / <span id="total-questions">0</span>
    </div>

    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div id="quiz-box">
      <div class="question-text" id="question">Loading question...</div>
      <div class="options-grid" id="options"></div>
      <div class="result-msg" id="feedback"></div>
    </div>

    <button class="restart-btn" id="restart-btn" onclick="startQuiz()">Play Again</button>
  </div>

  <script>
    const quizData = [
      {
        question: "In what year were the Carolina Panthers established?",
        options: ["1993", "1995", "1998", "2001"],
        answer: 1
      },
      {
        question: "What is the official team chant / rally cry?",
        options: ["Fly Eagles Fly", "Keep Pounding", "Who Dat", "Rise Up"],
        answer: 1
      },
      {
        question: "Which stadium do the Panthers play in?",
        options: ["Bank of America Stadium", "MetLife Stadium", "Ford Field", "Nissan Stadium"],
        answer: 0
      },
      {
        question: "Who was the legendary linebacker who inspired the phrase 'Keep Pounding'?",
        options: ["Luke Kuechly", "Thomas Davis", "Sam Mills", "Julius Peppers"],
        answer: 2
      },
      {
        question: "What are the official team colors of the Panthers?",
        options: ["Blue, Gold & White", "Process Blue, Black & Silver", "Navy Blue & Gold", "Teal, Black & White"],
        answer: 1
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 10;
    const TIME_LIMIT = 10;

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById("score").textContent = score;
      document.getElementById("total-questions").textContent = quizData.length;
      document.getElementById("restart-btn").style.display = "none";
      document.getElementById("quiz-box").style.display = "block";
      showQuestion();
    }

    function showQuestion() {
      clearInterval(timer);
      timeLeft = TIME_LIMIT;
      updateTimerBar();

      const q = quizData[currentQuestionIndex];
      document.getElementById("question").textContent = `Q${currentQuestionIndex + 1}: ${q.question}`;
      document.getElementById("feedback").textContent = "";

      const optionsContainer = document.getElementById("options");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      timer = setInterval(() => {
        timeLeft--;
        updateTimerBar();
        if (timeLeft <= 0) {
          clearInterval(timer);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerBar() {
      const percentage = (timeLeft / TIME_LIMIT) * 100;
      document.getElementById("timer-bar").style.width = `${percentage}%`;
    }

    function handleTimeout() {
      const feedbackEl = document.getElementById("feedback");
      feedbackEl.style.color = "#f87171";
      feedbackEl.textContent = "Time's up!";

      disableButtons();
      nextQuestionDelay();
    }

    function checkAnswer(selectedIdx) {
      clearInterval(timer);
      const correctIdx = quizData[currentQuestionIndex].answer;
      const feedbackEl = document.getElementById("feedback");

      if (selectedIdx === correctIdx) {
        score++;
        document.getElementById("score").textContent = score;
        feedbackEl.style.color = "#4ade80";
        feedbackEl.textContent = "Correct! Keep Pounding!";
      } else {
        feedbackEl.style.color = "#f87171";
        feedbackEl.textContent = `Incorrect! Answer: ${quizData[currentQuestionIndex].options[correctIdx]}`;
      }

      disableButtons();
      nextQuestionDelay();
    }

    function disableButtons() {
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(btn => btn.disabled = true);
    }

    function nextQuestionDelay() {
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
          showQuestion();
        } else {
          endQuiz();
        }
      }, 1500);
    }

    function endQuiz() {
      clearInterval(timer);
      document.getElementById("question").textContent = "Game Over!";
      document.getElementById("options").innerHTML = "";
      document.getElementById("timer-bar").style.width = "0%";
      
      const percentageScore = Math.round((score / quizData.length) * 100);
      document.getElementById("feedback").style.color = "#ffffff";
      document.getElementById("feedback").textContent = `Final Score: ${score} / ${quizData.length} (${percentageScore}%)`;
      document.getElementById("restart-btn").style.display = "inline-block";
    }

    startQuiz();
  </script>

</body>
</html>
